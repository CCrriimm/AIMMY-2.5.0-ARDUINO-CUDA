[workspace]
resolver = "2"
members = [
    "aimmy-core",
    "aimmy-capture",
    "aimmy-inference",
    "aimmy-input",
    "aimmy-bindings",
    "aimmy-ui",
    "aimmy",
]

[workspace.package]
version = "2.5.0"
edition = "2021"
rust-version = "1.70"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
