[package]
name = "aimmy-bindings"
description = "Global keyboard/mouse keybind hook for Aimmy Rust"

[dependencies]
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }
