name: Build (Windows)

# Compiles the WPF application on a real Windows runner so that code changes are
# verified by the compiler on every push and pull request, instead of only being
# discovered when someone opens the solution locally.
#
# The previous version of this file never ran: it was triggered on a branch called
# "Aimmy-V2" (this repository uses "Aimmy-V2-CUDA"), and it passed an undefined
# $env:Solution_Path to msbuild, so it would have failed even if it had matched.

on:
  push:
    branches:
      - Aimmy-V2-CUDA
  pull_request:
    branches:
      - Aimmy-V2-CUDA
  workflow_dispatch:

# A new push to the same branch makes an in-flight build obsolete.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROJECT: Aimmy2/Aimmy2.csproj
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  build:
    name: Build x64 Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The ONNX Runtime GPU package is large; caching it keeps runs short.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Aimmy2.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "$env:PROJECT" -p:Platform=$env:PLATFORM -p:Configuration=$env:CONFIGURATION

      # Fody normally generates FodyWeavers.xsd as a build artifact. It is listed in
      # .gitignore, so make sure a stale copy can never break the build.
      - name: Remove regenerated Fody schema
        run: |
          if (Test-Path "Aimmy2/FodyWeavers.xsd") { Remove-Item "Aimmy2/FodyWeavers.xsd" -Force }

      - name: Build
        shell: pwsh
        run: |
          # Build once, keeping the log so the diagnostics step does not have to rebuild.
          dotnet build "$env:PROJECT" --configuration $env:CONFIGURATION --no-restore `
            -p:Platform=$env:PLATFORM -v:normal 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Show compiler diagnostics
        if: always()
        shell: pwsh
        run: |
          # Surface the errors/warnings in the job summary so a failure is readable
          # without digging through the raw log.
          if (-not (Test-Path build.log)) {
            "No build log produced." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          $diag = Select-String -Path build.log -Pattern '(error|warning) (CS|MSB|NETSDK|WPF)\d+' |
                  ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique | Select-Object -First 100
          if ($diag) {
            "### Compiler diagnostics" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $diag | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "### Compiler diagnostics`nNone - build is clean." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: AntiGravity-${{ env.PLATFORM }}-${{ env.CONFIGURATION }}
          path: Aimmy2/bin/${{ env.PLATFORM }}/${{ env.CONFIGURATION }}/net8.0-windows/
          if-no-files-found: warn
          retention-days: 7
